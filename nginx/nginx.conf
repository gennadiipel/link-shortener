# Capacity settings for the proxy. A proxied keep-alive request uses one
# client connection and, while active, one upstream API connection. The image
# default of 1,024 connections is too small for the k6 high-concurrency
# profiles, even when CPU and memory are otherwise idle.
worker_processes auto;
worker_rlimit_nofile 65535;

pcre_jit on;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Immutable redirect targets are safe to keep in-process. Counter writes
    # are aggregated here and flushed asynchronously to Redis so a hot link
    # does not make every redirect wait on a Redis write.
    lua_shared_dict link_targets 64m;
    lua_shared_dict link_counters 32m;
    lua_shared_dict link_counter_dirty 16m;
    init_worker_by_lua_file /etc/nginx/lua/init-worker.lua;

    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path /var/run/openresty/nginx-proxy;
    fastcgi_temp_path /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path /var/run/openresty/nginx-uwsgi;
    scgi_temp_path /var/run/openresty/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}

include /etc/nginx/conf.d/*.main;
