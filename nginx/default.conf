lua_package_path "/etc/nginx/lua/?.lua;;";
resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80;
  server_name _;

  location = /api {
    return 308 /api/;
  }

  location ^~ /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /client {
    return 308 /client/;
  }

  location = /client/ {
    root /usr/share/nginx/html;
    try_files /client/_shell.html =404;
  }

  location ^~ /client/ {
    root /usr/share/nginx/html;
    try_files $uri /client/_shell.html;
  }

  location ~ "^/(?<short_code>[a-z0-9]{7})$" {
    content_by_lua_file /etc/nginx/lua/short-link.lua;
  }

  location = /_internal/resolve-link {
    internal;
    proxy_pass http://api:8000/links/$arg_code/redirect;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 302 https://www.google.com/;
  }
}
