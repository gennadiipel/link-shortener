services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: link_shortener
      POSTGRES_PASSWORD: link_shortener
      POSTGRES_USER: link_shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link_shortener -d link_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
