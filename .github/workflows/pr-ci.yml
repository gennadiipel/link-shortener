name: Pull Request CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up development environment
        run: bun run env:setup

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Start reverse-proxy stack
        run: docker compose --env-file .env.dev --profile stack up --build --wait

      - name: Migrate database and create a link
        run: |
          bun run db:migrate
          bun run cli link:create https://example.com
          docker compose --env-file .env.dev exec -T postgres psql -U link_shortener -d link_shortener -tAc "SELECT count(*) FROM links WHERE target_url = 'https://example.com/'" | grep '^1$'

      - name: Smoke test reverse proxy
        run: |
          curl --fail --show-error http://localhost:8080/api/hello
          curl --fail --show-error http://localhost:8080/client/
          curl --silent --show-error --dump-header - --output /dev/null http://localhost:8080/short-code | tr -d '\r' | grep --ignore-case '^location: https://www.google.com/$'

      - name: Stop reverse-proxy stack
        if: always()
        run: docker compose --env-file .env.dev --profile stack down --volumes --remove-orphans
